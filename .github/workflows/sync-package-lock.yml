name: Synchroniser package-lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-package-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run check

      - name: Committer le lockfile mis à jour
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json est déjà synchronisé."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchroniser le fichier package-lock"
          git push origin HEAD:main
