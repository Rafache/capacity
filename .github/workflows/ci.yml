name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Format
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Build
        id: build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Verify production asset paths
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          grep -q '="/assets/' dist/index.html
          ! grep -q '/capacity/' dist/index.html

      - name: Upload site bundle
        if: ${{ success() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    needs: [quality, tests]
    if: >-
      ${{ needs.quality.result == 'success' && needs.tests.result == 'success' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'Rafache' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.pull_request.number) || 'production' }}
      url: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.pages-deployment-alias-url || 'https://capacity.chem1.fr/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Download site bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=capacity
            --commit-dirty=true
            ${{ github.event_name == 'pull_request' && format('--branch={0}', github.head_ref) || '' }}
