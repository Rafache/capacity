name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Format
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Build
        id: build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Verify production asset paths
        if: ${{ always() && steps.install.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          grep -q '="/assets/' dist/index.html
          ! grep -q '/capacity/' dist/index.html

      - name: Upload site bundle
        if: ${{ success() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Run tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run test:ci

      - name: Upload JUnit report
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy
    needs: [quality, tests]
    if: ${{ needs.quality.result == 'success' && needs.tests.result == 'success' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == 'Rafache' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.pull_request.number) || 'production' }}
      url: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.pages-deployment-alias-url || 'https://capacity.chem1.fr/' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download site bundle
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=capacity
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Publish deployment link
        env:
          DEPLOYMENT_URL: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.pages-deployment-alias-url || 'https://capacity.chem1.fr/' }}
        run: |
          test -n "$DEPLOYMENT_URL"
          {
            echo "### Cloudflare deployment"
            echo
            echo "[Open deployment]($DEPLOYMENT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
